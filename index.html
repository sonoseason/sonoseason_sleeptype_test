<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#9a9183">
  <title>나에게 맞는 매트리스 찾기 | SONOSEASON</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section class="screen active" id="homeScreen">
      <div class="hero">
        <p class="eyebrow">SONOSEASON MATTRESS</p>
        <h1>나에게 맞는<br><em>매트리스</em> 찾기</h1>
        <p class="lead">몇 가지 질문으로 나의 매트리스 취향을 알아보세요.</p>
        <button class="primary" id="startBtn">테스트 시작하기 <span>→</span></button>
        <p class="notice">약 2분 · 총 5문항</p>
      </div>
      <div class="bottom-note">본 테스트는 제품 선택을 위한 참고 정보입니다.</div>
    </section>

    <section class="screen" id="quizScreen">
      <div class="quiz-wrap">
        <header class="quiz-header">
          <button class="icon-btn" id="backBtn" aria-label="이전">←</button>
          <div class="progress"><span id="progressBar"></span></div>
          <span class="count" id="countText">1 / 5</span>
        </header>

        <div class="question-area">
          <p class="question-kicker" id="questionKicker">QUESTION 01</p>
          <h2 id="questionText"></h2>
          <p class="question-sub" id="questionSub"></p>
          <div class="answers" id="answers"></div>
        </div>
      </div>
    </section>

    <section class="screen" id="loadingScreen">
      <div class="loading-wrap">
        <div class="loader"></div>
        <p class="eyebrow">YOUR SLEEP STYLE</p>
        <h2>나에게 맞는<br>매트리스를 찾고 있어요.</h2>
      </div>
    </section>

    <section class="screen" id="resultScreen">
      <div class="result-wrap">
        <p class="eyebrow">YOUR MATTRESS STYLE</p>
        <p class="result-label">당신의 매트리스 취향은</p>
        <h1 id="resultTitle"></h1>
        <p class="result-desc" id="resultDesc"></p>

        <div class="traits" id="traits"></div>

        <div class="recommend-box">
          <p class="box-label">RECOMMENDED</p>
          <h2 id="recommendTitle"></h2>
          <p id="recommendReason"></p>
          <div class="product-meta" id="productMeta"></div>
          <button class="secondary" id="productBtn">추천 제품 보기 <span>→</span></button>
        </div>

        <div class="result-actions">
          <button class="text-btn" id="retryBtn">다시 테스트하기</button>
          <button class="share-btn" id="shareBtn">결과 공유하기</button>
        </div>
      </div>
    </section>

    <section class="screen" id="placeholderScreen">
      <div class="placeholder">
        <p class="eyebrow">SONOSEASON</p>
        <h2>제품 상세 페이지</h2>
        <p>실제 제품 URL을 입력하면 이 버튼과 연결할 수 있어요.</p>
        <button class="secondary" id="placeholderBack">테스트 결과로 돌아가기</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
